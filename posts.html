<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StayNest Posts | Trusted property updates</title><meta name="description" content="Explore trusted property updates, home inspiration, and useful recommendations from StayNest agents."><meta name="theme-color" content="#2d5a3d"><link rel="canonical" href="/posts.html"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/accessibility.css">
  <style>
    .posts-page{min-height:100vh;background:#f6f8f5;padding:28px 16px 80px}.posts-head{max-width:680px;margin:0 auto 20px;display:flex;align-items:end;justify-content:space-between;gap:15px}.posts-head h1{margin:0}.posts-head p{color:var(--muted);font-size:13px}.posts-filter{border:1px solid #dbe5dd;border-radius:8px;background:#fff;padding:9px;font:inherit;color:var(--ink)}
    .feed{max-width:620px;margin:auto;display:grid;gap:20px}.post-card{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(31,67,45,.16)}.post-byline{display:flex;align-items:center;gap:10px;padding:13px 16px;color:var(--ink)}.post-byline:hover{background:rgba(111,155,120,.14)}.post-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#dfe9e2}.post-byline small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.post-media{width:100%;aspect-ratio:4/5;object-fit:cover;background:#dfe9e2;display:block}.post-copy{padding:14px 16px}.post-copy h2{font-size:20px;margin:0 0 6px}.post-copy p{color:var(--muted);font-size:13px;line-height:1.5;margin:0}.post-meta{display:flex;justify-content:space-between;margin-top:12px;color:#718078;font-size:11px}.feed-empty{padding:45px 20px;text-align:center;background:rgba(255,255,255,.2);border:1px dashed rgba(45,90,61,.3);border-radius:14px;color:var(--muted);backdrop-filter:blur(12px)}
  </style>
</head>
<body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">⌂</span><span>stay<span>nest</span></span></a><nav class="main-nav"><a href="/">Explore stays</a><a href="/posts.html" aria-current="page">Posts</a></nav><div class="header-actions"><a class="text-btn" href="/">Home</a></div></header>
<main class="posts-page"><div class="posts-head"><div><p class="eyebrow">StayNest Posts</p><h1>From the agents you follow</h1><p>Personalized posts ranked by relevance, quality, freshness, and engagement. Sign in to follow agents and view your personalized feed.</p></div><select class="posts-filter" id="sort"><option value="rank">For you</option><option value="recent">Latest</option><option value="popular">Popular</option></select></div><section class="feed" id="feed"><div class="feed-empty">Loading your feed…</div></section></main>
<script type="module" src="/posts.js"></script><script type="module" src="/app-enhancements.js"></script>
</body>
</html>
