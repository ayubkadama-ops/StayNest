<head>

  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StayNest Posts | Trusted property updates</title><meta name="description" content="Explore trusted property updates, home inspiration, and useful recommendations from StayNest agents."><meta name="theme-color" content="#FF385C"><link rel="icon" href="/assets/staynest-mark.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/staynest-mark.svg"><link rel="canonical" href="/posts.html"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/accessibility.css">
  <style>
    :root {
      --rausch: #ff385c;
      --rausch-hover: #e00b41;
      --ink: #222222;
      --body: #484848;
      --muted: #717171;
      --line: #ebebeb;
      --line-strong: #dddddd;
      --canvas: #ffffff;
      --surface-soft: #f7f7f7;
    }
    body {
      background: var(--surface-soft);
      color: var(--ink);
      font-family: 'Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DM Sans', sans-serif;
    }
    .posts-page {
      min-height: 100vh;
      background: var(--surface-soft);
      padding: 32px 20px 80px;
    }
    .posts-head {
      max-width: 680px;
      margin: 0 auto 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    .posts-head h1 {
      margin: 4px 0 0;
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.3px;
    }
    .posts-head p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      margin: 6px 0 0;
    }
    .posts-filter {
      border: 1px solid var(--line-strong);
      border-radius: 9999px;
      background: #fff;
      padding: 10px 18px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      outline: none;
    }
    .posts-filter:hover {
      border-color: #222;
    }
    .agent-posts-view .posts-page {
      background: #f7f7f7;
    }
    .agent-posts-view .posts-head {
      max-width: 980px;
      padding: 24px 28px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .agent-posts-view .feed {
      max-width: 980px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    .feed {
      max-width: 640px;
      margin: auto;
      display: grid;
      gap: 24px;
    }
    .post-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .post-card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }
    .post-byline {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      color: var(--ink);
      font-weight: 600;
      font-size: 14px;
      transition: background 0.15s ease;
    }
    .post-byline:hover {
      background: #fafafa;
    }
    .post-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface-soft);
      border: 1px solid var(--line);
    }
    .post-byline small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      margin-top: 2px;
    }
    .post-media {
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: cover;
      background: #f0f0f0;
      display: block;
    }
    .post-copy {
      padding: 16px 18px 18px;
    }
    .post-copy h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 6px;
    }
    .post-copy p {
      color: var(--body);
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
    }
    .post-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    .feed-empty {
      padding: 48px 24px;
      text-align: center;
      background: #ffffff;
      border: 1px dashed var(--line-strong);
      border-radius: 16px;
      color: var(--muted);
      font-size: 14px;
    }
    .post-book-button {
      margin-top: 14px;
      background: var(--rausch);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .post-book-button:hover {
      background: var(--rausch-hover);
    }
    .post-booking-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
    }
    .post-booking-dialog {
      position: relative;
      width: min(100%, 460px);
      padding: 28px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .post-booking-dialog form {
      display: grid;
      gap: 12px;
    }
    .post-booking-dialog label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }
    .post-booking-dialog input {
      padding: 12px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      font: inherit;
      outline: none;
    }
    .post-booking-dialog input:focus {
      border-color: var(--ink);
    }
    .post-booking-close {
      position: absolute;
      right: 16px;
      top: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 0;
      background: var(--surface-soft);
      display: grid;
      place-items: center;
      font-size: 18px;
      cursor: pointer;
    }
    .booking-sent {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #e6f7ec;
      color: #0e7036;
      font-size: 13px;
      font-weight: 500;
    }
    @media (max-width: 600px) {
      .posts-head {
        flex-direction: column;
        align-items: flex-start;
      }
      .posts-filter {
        width: 100%;
      }
    }
  </style>
</head>

<main class="posts-page"><div class="posts-head"><div><p class="eyebrow">StayNest Posts</p><h1>From trusted StayNest agents</h1><p>Explore approved property updates ranked by quality, freshness, and engagement. Sign in to follow agents and personalize your feed.</p></div><select class="posts-filter" id="sort"><option value="rank">Recommended</option><option value="recent">Latest</option><option value="popular">Popular</option></select></div><section class="feed" id="feed"><div class="feed-empty">Loading approved agent posts…</div></section></main><div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden><span class="toast-icon" aria-hidden="true">✓</span><span class="toast-message"></span><button class="toast-close" type="button" aria-label="Dismiss message">×</button><span class="toast-progress" aria-hidden="true"></span></div>
<script type="module" src="/posts.js"></script><script type="module" src="/app-enhancements.js"></script>
</body>
