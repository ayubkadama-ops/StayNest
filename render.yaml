services:
  - type: web
    name: staynest
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run cloudinary:sync-assets && npm run build
    startCommand: npm run start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: APP_ORIGIN
        value: https://staynest-np7j.onrender.com
      - key: CORS_ORIGINS
        value: https://staynest-np7j.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_GATE_USERNAME
        sync: false
      - key: ADMIN_GATE_PASSWORD_HASH
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: s9p5ymwd
      - key: CLOUDINARY_API_KEY
        value: "923699335673225"
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_ASSETS_ENABLED
        value: "true"
      - key: GOOGLE_CALLBACK_URL
        value: https://staynest-np7j.onrender.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DJANGO_ADMIN_URL
        value: https://staynest-django-admin.onrender.com
      - key: PUBLIC_APP_URL
        value: https://staynest-np7j.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
  - type: web
    name: staynest-django-admin
    runtime: python
    plan: free
    buildCommand: pip install -r django_admin/requirements.txt && python django_admin/manage.py collectstatic --noinput && python django_admin/manage.py check
    startCommand: gunicorn --chdir django_admin staynest_admin.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: API_UPSTREAM_URL
        value: https://staynest-np7j.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        value: staynest-django-admin.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://staynest-django-admin.onrender.com
      - key: DJANGO_DEBUG
        value: "false"
      - key: MARKETPLACE_URL
        value: https://staynest-np7j.onrender.com
      - key: ADMIN_GATE_USERNAME
        sync: false
      - key: ADMIN_GATE_PASSWORD_HASH
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
