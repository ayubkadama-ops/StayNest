<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administrator access · Makazi Go</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7f5;color:#173222;font:16px system-ui}
    main{width:min(480px,calc(100% - 40px));padding:28px;background:#fff;border:1px solid #dfe7df;border-radius:14px}
    h1{margin-top:0;font-size:24px}p{line-height:1.55;color:#526357}
    button{padding:10px 14px;border:0;border-radius:7px;background:#2d5a3d;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Welcome, {{ admin_name }}</h1>
    <p>Your administrator account is active, but no console features have been assigned yet. Ask the Founder Console administrator to grant the access you need.</p>
    <form method="post" action="/admin/logout/">{% csrf_token %}<button type="submit">Sign out</button></form>
  </main>
</body>
</html>
