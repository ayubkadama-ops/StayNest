<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StayNest Admin Login</title><style>body{margin:0;background:#f5f7f5;color:#173222;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,calc(100% - 32px));padding:32px;background:#fff;border:1px solid #dfe7df;border-radius:16px;box-shadow:0 10px 30px #17322218}h1{margin-top:0}label{display:grid;gap:6px;margin:14px 0;font-size:13px;font-weight:700}input{padding:12px;border:1px solid #cbd7cd;border-radius:8px;font:inherit}button{padding:12px 16px;border:0;border-radius:8px;background:#2d5a3d;color:#fff;font-weight:700;cursor:pointer}.error{color:#a22;margin:10px 0}</style></head><body><main class="card"><p>StayNest operations</p><h1>Administrator sign in</h1>{% for message in messages %}<p class="error">{{ message }}</p>{% endfor %}<form method="post">{% csrf_token %}<label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Open admin console</button></form></main></body></html>
