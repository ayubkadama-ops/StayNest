{% if section == 'settings' %}<section class="panel"><h2>Operational writes</h2><form method="post" action="/action/setting/" class="settings"><input type="hidden" name="section" value="settings"><label>Setting key<input name="key" required></label><label>Value<input name="value" required></label><button class="button primary">Save setting</button></form><form method="post" action="/action/ip-rule/" class="settings"><input type="hidden" name="section" value="settings"><label>Rule type<select name="rule_type"><option value="allow">Allow</option><option value="deny">Deny</option></select></label><label>CIDR<input name="cidr" placeholder="192.168.1.0/24" required></label><label>Label<input name="label"></label><button class="button primary">Add network rule</button></form></section>{% elif section == 'posts' %}<section class="panel"><h2>Publish an announcement</h2><form method="post" action="/action/announcement/"><input type="hidden" name="section" value="posts"><label>Title<input name="title" required></label><label>Audience<select name="audience"><option value="all">Everyone</option><option value="tenants">Tenants</option><option value="agents">Agents</option><option value="administrators">Administrators</option></select></label><label>Message<textarea name="body" rows="4" required></textarea></label><label><input type="checkbox" name="publish_now" value="1"> Publish now</label><button class="button primary">Save announcement</button></form></section>{% elif section == 'users' %}<section class="panel"><h2>Create administrator</h2><form method="post" action="/action/admin-create/" class="settings"><input type="hidden" name="section" value="users"><label>First name<input name="first_name" required></label><label>Last name<input name="last_name" required></label><label>Email<input name="email" type="email" required></label><label>Temporary password<input name="password" type="password" minlength="12" required></label><button class="button primary">Create administrator</button></form></section>{% endif %}
