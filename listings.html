<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse homes, apartments, land, hotels, and commercial property across Tanzania with Makazi Go.">
  <meta name="theme-color" content="#062b22">
  <title>Property listings | Makazi Go</title>
  <link rel="icon" href="/assets/makazi-go-icon.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/accessibility.css">
</head>
<body class="listings-page-shell">
  <header class="topbar listings-page-header">
    <a class="brand" href="/index.html#top" aria-label="Makazi Go home"><span class="brand-mark" aria-hidden="true">⌂</span><span>Makazi <span>Go</span></span></a>
    <nav class="main-nav" aria-label="Primary navigation">
      <a class="active" href="/listings.html">Listings</a>
      <a href="/index.html#agent-marketplace">Explore agents</a>
      <a href="/index.html#how">How it works</a>
    </nav>
    <a class="primary small host-nav-cta" href="/index.html#host">List your place</a>
    <button class="menu" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
  </header>

  <main class="listings-page" id="listingsPage">
    <section class="listings-page-heading">
      <div>
        <p class="eyebrow">Makazi Go properties</p>
        <h1>Find a place that fits your life.</h1>
        <p>Browse verified homes, apartments, land, hotels, and commercial spaces across Tanzania.</p>
      </div>
    </section>
    <form class="listings-filter-bar" id="listingFilters">
      <label>Search<input name="q" placeholder="City, neighborhood, or property"></label>
      <label>Property type<select name="propertyType"><option value="">All properties</option><option value="house">Homes</option><option value="apartment">Apartments</option><option value="land">Land</option><option value="hotel">Hotels</option><option value="commercial">Commercial</option></select></label>
      <label>Stay type<select name="rentalMode"><option value="">Any stay</option><option value="short_term">Short-term</option><option value="long_term">Long-term</option></select></label>
      <label>Sort<select name="sort"><option value="new">Newest</option><option value="popular">Most loved</option><option value="price_low">Price: low to high</option></select></label>
      <button class="primary" type="submit">Search properties</button>
    </form>
    <p class="listings-result-note" id="listingsResultNote" role="status"></p>
    <section class="all-listings-grid" id="allListingsGrid" aria-live="polite"></section>
  </main>
  <div class="toast" id="listingToast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/listings-page.js"></script>
</body>
</html>
